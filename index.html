<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resistration form</title>
    <!-- main style file link -->
     <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="form-layout">
        <div class="container">
           <div class="form-inner">
            <div class="left">

            </div>
            <div class="right">
                <h3>resistration form</h3>
                <form>
                    <div class="name">
                        <input type="text" placeholder="enter your first name" class="fname">
                        <input type="text" placeholder="enter your last name">
                    </div>
                    <div class="email">
                        <input type="email" placeholder="enter your email">
                    </div>
                    <div class="password">
                        <input type="password" placeholder="create a strong password">
                    </div>
                    <div class="dob">
                        <label>enter your date of birth</label>
                        <input type="date">
                    </div>
                    <div class="gender">
                         <select>
                              <option>select your gender</option>
                              <option>male</option>
                              <option>female</option>
                              <option>others</option>
                         </select>
                    </div>
                    <div class="messege">
                       <textarea placeholder="enter your messege"></textarea>   
                    </div>
                    <div class="tc">
                        <input type="checkbox">
                        <span>i agree to the <a href="#">terms and conditioin</a></span>
                    </div>
                      <div class="submit-btns">
                        <input type="submit" value="submit">
                    </div>
                </form>
            </div>
           </div>
        </div>
    </section>
</body>
</html>
